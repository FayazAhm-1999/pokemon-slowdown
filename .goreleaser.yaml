# GoReleaser configuration for pokemon slowdown.
#
# Builds the `slowdown` binary for the supported platforms, publishes a GitHub
# release with checksums, and updates the Homebrew formula in the tap.
#
# Verify locally without publishing:
#
#   make snapshot        # goreleaser build --snapshot --clean
#
# Publishing a release:
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# See the "Releasing" section of the README for the Homebrew tap setup.
version: 2

project_name: pokemon-slowdown

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: slowdown
    main: ./cmd/slowdown
    binary: slowdown
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is not a target for now.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# A Formula rather than a Cask, deliberately: casks are macOS-only, and a
# terminal client has a large Linux audience. GoReleaser marks `brews` as
# deprecated in favour of `homebrew_casks`, but the replacement would drop
# Linuxbrew support, so the formula stays until that changes.
brews:
  - name: pokemon-slowdown
    repository:
      owner: unnipv
      name: homebrew-tap
      # Requires a personal access token with `repo` scope on the tap, stored as
      # the HOMEBREW_TAP_GITHUB_TOKEN secret. The default GITHUB_TOKEN cannot
      # push to a different repository. The release workflow skips this step
      # when the secret is absent, so a release still succeeds without it.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/unnipv/pokemon-slowdown"
    description: "A calm, keyboard-first terminal client for Pokémon Showdown"
    license: "MIT"
    install: |
      bin.install "slowdown"
    test: |
      system "#{bin}/slowdown", "--version"

release:
  draft: false
  prerelease: auto
